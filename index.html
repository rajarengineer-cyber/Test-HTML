<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌿 NightShift Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#0a1628;color:#e8f4f8;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding-bottom:40px;}
input,select,button{font-family:inherit;outline:none;}
input::placeholder{color:#446070;}
select option{background:#0d2137;color:#e8f4f8;}
.header{background:linear-gradient(90deg,#006d77,#008080);padding:16px 16px 12px;box-shadow:0 4px 24px rgba(0,109,119,.4);}
.header-row{display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:19px;font-weight:800;letter-spacing:1px;color:#fff;}
.header p{font-size:11px;color:#b2dfdb;margin-top:2px;}
.wt-num{font-size:20px;font-weight:800;color:#80cbc4;text-align:right;}
.tabs{display:flex;gap:3px;padding:10px 10px 0;background:#0d2137;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{padding:7px 11px;border-radius:8px 8px 0 0;border:none;cursor:pointer;font-size:11px;font-weight:500;white-space:nowrap;background:transparent;color:#78a8b8;transition:all .2s;}
.tab-btn.active{background:#006d77;color:#fff;font-weight:700;}
.content{padding:12px;}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:13px;margin-bottom:11px;}
.card-title{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#80cbc4;text-transform:uppercase;margin-bottom:9px;}
.stat-row{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;}
.stat{flex:1;min-width:70px;border-radius:12px;padding:10px 7px;text-align:center;}
.stat-num{font-size:20px;font-weight:800;line-height:1;}
.stat-lbl{font-size:10px;color:#78a8b8;margin-top:3px;}
.stat-sub{font-size:9px;color:#78a8b8;margin-top:1px;}
.pbar{height:6px;border-radius:4px;background:#1a3545;overflow:hidden;margin-top:4px;}
.pfill{height:100%;border-radius:4px;transition:width .5s;}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;color:#fff;}
.btn-teal{background:linear-gradient(135deg,#006d77,#00897b);}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#6d28d9);}
.btn-green{background:linear-gradient(135deg,#059669,#047857);}
.btn-gray{background:#446070;}
.btn-full{width:100%;padding:11px;font-size:13px;}
.inp{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#e8f4f8;padding:8px 11px;font-size:13px;width:100%;}
.water-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
.water-btn{width:28px;height:28px;border-radius:6px;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.meal-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.slot-card{border-radius:12px;padding:12px;margin-bottom:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
.food-item{display:flex;align-items:center;gap:8px;padding:5px 8px;background:rgba(255,255,255,.04);border-radius:8px;margin-top:5px;}
.food-item .fname{font-size:12px;font-weight:600;}
.food-item .fmeta{font-size:11px;color:#78a8b8;}
.food-item .fmacro{font-size:10px;color:#446070;margin-top:1px;}
.food-item .fkcal{font-size:12px;font-weight:700;color:#f59e0b;flex-shrink:0;}
.remove-btn{background:none;border:none;color:#446070;cursor:pointer;font-size:14px;padding:0 2px;}
.result-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.result-card .rname{font-size:13px;font-weight:700;}
.result-card .rmeta{font-size:11px;color:#78a8b8;margin-top:2px;}
.result-card .rmacro{font-size:10px;color:#446070;margin-top:2px;}
.qty-ctrl{display:flex;align-items:center;gap:4px;background:#1a3545;border-radius:8px;padding:3px 8px;}
.qty-ctrl button{background:none;border:none;color:#80cbc4;cursor:pointer;font-size:18px;line-height:1;padding:0 2px;}
.qty-ctrl span{font-size:13px;font-weight:700;min-width:26px;text-align:center;}
.add-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px;}
.chip{padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:transparent;color:#78a8b8;font-size:11px;cursor:pointer;white-space:nowrap;}
.chip.active{border-color:#006d77;background:rgba(0,109,119,.2);color:#80cbc4;font-weight:700;}
.ex-grid{display:flex;gap:7px;flex-wrap:wrap;}
.ex-btn{flex:1;min-width:80px;padding:9px 6px;border-radius:10px;border:1px solid rgba(255,255,255,.08);cursor:pointer;background:rgba(255,255,255,.05);color:#78a8b8;font-size:11px;font-weight:600;text-align:center;transition:all .2s;}
.ex-btn.active{background:linear-gradient(135deg,#006d77,#00897b);border-color:#006d77;color:#fff;}
.week-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px;margin-bottom:6px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.bar-val{font-size:9px;color:#80cbc4;}
.bar-track{width:100%;background:#1a3545;border-radius:4px;height:55px;display:flex;align-items:flex-end;}
.bar-fill{width:100%;border-radius:4px;transition:height .4s;}
.bar-day{font-size:9px;color:#446070;}
.dot-row{display:flex;gap:3px;}
.dot{width:7px;height:7px;border-radius:50%;}
.tip-item{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.tip-title{font-size:13px;font-weight:700;color:#e8f4f8;margin-bottom:2px;}
.tip-desc{font-size:11px;color:#78a8b8;line-height:1.5;}
.hungry-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(255,255,255,.04);border-radius:10px;margin-bottom:6px;border:1px solid rgba(255,255,255,.06);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#006d77;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,109,119,.5);z-index:1000;white-space:nowrap;display:none;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:999;display:none;}
.modal-box{background:#0d2137;border:1px solid #006d7755;border-radius:16px;padding:22px;width:290px;}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;}
.search-inp{padding-left:32px;}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#446070;cursor:pointer;font-size:15px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <h1>🌿 NightShift Tracker</h1>
      <p id="hdr-date">Loading... · Shift 5:30 PM–2:30 AM</p>
    </div>
    <div style="text-align:right">
      <div class="wt-num" id="hdr-weight">—</div>
      <button class="btn btn-teal" style="font-size:10px;padding:3px 9px;margin-top:3px" onclick="openWeightModal()">Log Weight</button>
    </div>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>
<div class="toast" id="toast"></div>

<!-- Weight Modal -->

<div class="modal-overlay" id="weightModal" onclick="closeWeightModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div style="font-size:15px;font-weight:700;margin-bottom:11px;color:#80cbc4">⚖️ Log Today's Weight</div>
    <input class="inp" type="number" id="weightInp" placeholder="e.g. 81.5" step="0.1" style="margin-bottom:11px">
    <div style="display:flex;gap:7px">
      <button class="btn btn-teal" style="flex:1;padding:9px" onclick="saveWeight()">Save</button>
      <button class="btn btn-gray" style="flex:1;padding:9px" onclick="closeWeightModal()">Cancel</button>
    </div>
  </div>
</div>

function getTodayKey(){ return new Date().toISOString().slice(0,10); }
function loadData(){ try{ const r=localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }catch(e){} }
function getToday(){ return state.data[getTodayKey()]||{mealFoods:{},exercises:{},water:0,weight:null,note:""}; }
function updateToday(patch){
  const k=getTodayKey();
  state.data[k]={...(state.data[k]||{}), ...patch};
  saveData();
}
function getWeekDates(){
  return Array.from({length:7},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i));
    return d.toISOString().slice(0,10);
  });
}

// ── FOOD SEARCH ─────────────────────────────────────────────────
function searchFoods(q){
  if(!q||q.length<1) return [];
  const query=q.toLowerCase().trim();
  const words=query.split(/\s+/).filter(w=>w.length>1);
  return ALL_FOODS.map(f=>{
    const n=f.name.toLowerCase();
    const c=f.cat.toLowerCase();
    let score=0;
    if(n===query) score=100;
    else if(n.startsWith(query)) score=85;
    else if(n.includes(query)) score=70;
    else if(c===query) score=50;
    else if(c.includes(query)) score=35;
    else if(words.some(w=>n.includes(w))) score=45;
    return {...f,score};
  }).filter(f=>f.score>0).sort((a,b)=>b.score-a.score).slice(0,10);
}

// ── ACTIONS ─────────────────────────────────────────────────────
function addFood(food, slot, qty){
  const td=getToday();
  const mf={...(td.mealFoods||{})};
  const sl=[...(mf[slot]||[])];
  const uid=food.id+"_"+Date.now();
  sl.push({
    uid, id:food.id, name:food.name,
    qty: qty===1 ? food.qty : qty+"× "+food.qty,
    weight: Math.round(food.weight*qty),
    unit: food.unit,
    kcal: Math.round(food.kcal*qty),
    protein: food.protein ? +(food.protein*qty).toFixed(1) : null,
    carbs: food.carbs ? +(food.carbs*qty).toFixed(1) : null,
    fat: food.fat ? +(food.fat*qty).toFixed(1) : null,
  });
  mf[slot]=sl;
  updateToday({mealFoods:mf});
  showToast("✅ "+food.name+" added to "+MEAL_SLOTS.find(s=>s.key===slot).label);
  render();
}

function removeFood(slot, uid){
  const td=getToday();
  const mf={...(td.mealFoods||{})};
  mf[slot]=(mf[slot]||[]).filter(f=>f.uid!==uid);
  updateToday({mealFoods:mf});
  render();
}

function toggleExercise(id){
  const td=getToday();
  const ex={...(td.exercises||{})};
  ex[id]=!ex[id];
  updateToday({exercises:ex});
  render();
}

function setWater(val){
  updateToday({water:Math.max(0,Math.min(WATER_GLASSES,val))});
  render();
}

// ── EXPORT CSV ───────────────────────────────────────────────────
function exportCSV(){
  const rows=[["Date","Meal","Food","Qty","Weight","Kcal","Protein(g)","Carbs(g)","Fat(g)","Water(ml)","Exercise","Body Weight(kg)"]];
  Object.entries(state.data).sort().forEach(([date,d])=>{
    const water=(d.water||0)*250;
    const ex=Object.entries(d.exercises||{}).filter(([,v])=>v).map(([k])=>k).join("+")||"-";
    const bw=d.weight||"-";
    const mf=d.mealFoods||{};
    let hasFood=false;
    Object.entries(mf).forEach(([slot,foods])=>{
      (foods||[]).forEach(f=>{
        hasFood=true;
        rows.push([date,slot,f.name,f.qty||"",""+(f.weight||"")+(f.unit||""),f.kcal||0,f.protein||"",f.carbs||"",f.fat||"",water,ex,bw]);
      });
    });
    if(!hasFood) rows.push([date,"-","-","-","-",0,"-","-","-",water,ex,bw]);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="NightShift_Log_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
}

// ── BACKUP & RESTORE ────────────────────────────────────────────
function backupData(){
  const json=JSON.stringify(state.data);
  const encoded=btoa(unescape(encodeURIComponent(json)));
  document.getElementById("backupOutput").value=encoded;
  document.getElementById("backupSection").style.display="block";
  showToast("✅ Backup code generated! Copy and save it.");
}

function copyBackup(){
  const el=document.getElementById("backupOutput");
  el.select();
  el.setSelectionRange(0,99999);
  try{
    document.execCommand("copy");
    showToast("✅ Backup code copied to clipboard!");
  }catch(e){
    showToast("Long press the text box to copy manually");
  }
}

function restoreData(){
  const code=document.getElementById("restoreInput").value.trim();
  if(!code){ showToast("⚠ Please paste your backup code first"); return; }
  try{
    const json=decodeURIComponent(escape(atob(code)));
    const parsed=JSON.parse(json);
    state.data={...state.data,...parsed};
    saveData();
    showToast("✅ Data restored! Your previous logs are back.");
    render();
  }catch(e){
    showToast("❌ Invalid backup code. Please check and try again.");
  }
}

function renderSearchResults(){
  const el=document.getElementById("searchResults");
  if(!el) return;
  if(state.searchMode==="ai") return; // AI mode handled separately
  const results=searchFoods(state.searchQuery);
  if(state.searchQuery&&results.length===0){
    el.innerHTML=`<div style="text-align:center;padding:16px;color:#446070;font-size:12px">No results found. Try a different spelling.</div>`;
    return;
  }
  el.innerHTML=results.map(f=>{
    const qty=state.qtyMap[f.id]||1;
    const sKcal=Math.round(f.kcal*qty);
    const sWt=Math.round(f.weight*qty);
    const sP=f.protein?+(f.protein*qty).toFixed(1):null;
    const sC=f.carbs?+(f.carbs*qty).toFixed(1):null;
    const sF=f.fat?+(f.fat*qty).toFixed(1):null;
    const avoidReason=AVOID_FOODS[f.id]||null;
    return `
    <div class="result-card" style="${avoidReason?'border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.06)':''}">
      ${avoidReason?`<div style="font-size:10px;color:#f87171;font-weight:700;margin-bottom:5px;padding:3px 7px;background:rgba(239,68,68,.15);border-radius:5px">⚠️ Avoid: ${avoidReason}</div>`:''}
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px">
        <div style="flex:1">
          <div class="rname" style="${avoidReason?'color:#fca5a5':''}">${f.name}${avoidReason?' 🚫':''}</div>
          <div class="rmeta">Per serving: ${f.qty} · <span style="color:#f59e0b;font-weight:700">${sWt}${f.unit}</span></div>
          ${sP!==null?`<div style="font-size:10px;margin-top:3px;display:flex;gap:8px">
            <span style="color:#34d399">P:${sP}g</span>
            <span style="color:#fbbf24">C:${sC}g</span>
            <span style="color:#a78bfa">F:${sF}g</span>
          </div>`:""}
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:10px">
          <div style="font-size:18px;font-weight:800;color:${avoidReason?'#f87171':'#00bfa5'}">${sKcal}</div>
          <div style="font-size:10px;color:#78a8b8">kcal</div>
        </div>
      </div>
      <div class="add-row">
        <div class="qty-ctrl">
          <button onclick="changeQty('${f.id}',-0.5)">−</button>
          <span id="qty_${f.id}">${qty}×</span>
          <button onclick="changeQty('${f.id}',0.5)">+</button>
        </div>
        <select class="inp" style="flex:1;font-size:11px;padding:5px 8px" onchange="state.selectedSlot=this.value">
          ${MEAL_SLOTS.map(s=>`<option value="${s.key}"${state.selectedSlot===s.key?" selected":""}>${s.emoji} ${s.label}</option>`).join("")}

          onclick="addFood({id:'${f.id}',name:'${f.name}',qty:'${f.qty}',weight:${f.weight},unit:'${f.unit}',kcal:${f.kcal},protein:${f.protein||null},carbs:${f.carbs||null},fat:${f.fat||null}},'${state.selectedSlot}',${qty})">

  }).join("");
}

function changeQty(foodId, delta){
  const cur=state.qtyMap[foodId]||1;
  state.qtyMap[foodId]=Math.max(0.5,+(cur+delta).toFixed(1));
  renderSearchResults();
}

function findNutrition(query){
  const q = query.toLowerCase().trim();
  // Direct match
  if(NUTRITION_DB[q]) return NUTRITION_DB[q];
  // Partial match
  for(const key of Object.keys(NUTRITION_DB)){
    if(q.includes(key) || key.includes(q)) return NUTRITION_DB[key];
  }
  // Word match
  const words = q.split(/\s+/);
  for(const key of Object.keys(NUTRITION_DB)){
    if(words.some(w=>w.length>2 && key.includes(w))) return NUTRITION_DB[key];
  }
  // Also check ALL_FOODS
  const food = ALL_FOODS.find(f=>f.name.toLowerCase().includes(q)||q.includes(f.name.toLowerCase().split(" ")[0]));
  if(food){
    return {
      n:food.name, s:food.qty, w:food.weight, c:food.kcal,
      p:food.protein||0, cb:food.carbs||0, f:food.fat||0,
      fi:1, su:0, so:200,
      av: AVOID_FOODS[food.id]?true:false,
      tip: AVOID_FOODS[food.id]?AVOID_FOODS[food.id]:"Part of a balanced Indian diet",
      alt: AVOID_FOODS[food.id]?"Choose a healthier option":""
    };
  }
  return null;
}

function runAISearch(){
  const q = state.searchQuery.trim();
  if(!q){ showToast("⚠ Please type a food name first"); return; }
  const el = document.getElementById("searchResults");
  if(!el) return;

  const result = findNutrition(q);
  if(result){
    state.aiResult = {
      name: result.n,
      serving: result.s,
      weight_g: result.w,
      calories: result.c,
      protein_g: result.p,
      carbs_g: result.cb,
      fat_g: result.f,
      fiber_g: result.fi,
      sugar_g: result.su,
      sodium_mg: result.so,
      avoid: result.av,
      avoid_reason: result.av ? result.tip : "",
      health_note: result.av ? "" : result.tip,
      better_alternative: result.alt||""
    };
    renderAIResult(state.aiResult);
  } else {
    // Fallback — search the fixed database
    const dbResults = searchFoods(q);
    if(dbResults.length>0){
      const f = dbResults[0];
      state.aiResult = {
        name: f.name, serving: f.qty, weight_g: f.weight,
        calories: f.kcal, protein_g: f.protein||0,
        carbs_g: f.carbs||0, fat_g: f.fat||0,
        fiber_g: 2, sugar_g: 2, sodium_mg: 300,
        avoid: AVOID_FOODS[f.id]?true:false,
        avoid_reason: AVOID_FOODS[f.id]||"",
        health_note: "Part of a balanced Indian diet",
        better_alternative: ""
      };
      renderAIResult(state.aiResult);
    } else {
      el.innerHTML=`<div style="padding:16px;text-align:center">
        <div style="font-size:28px;margin-bottom:8px">🤔</div>
        <div style="font-size:13px;color:#fbbf24;font-weight:700;margin-bottom:6px">Food not found in database</div>
        <div style="font-size:11px;color:#78a8b8;margin-bottom:12px">Try switching to 📋 Database tab and browse by category</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
          ${["idli","rice","chicken","dal","banana","oats"].map(s=>`<button class="chip" onclick="state.searchQuery='${s}';document.getElementById('searchInp').value='${s}';runAISearch()">${s}</button>`).join("")}
        </div>
      </div>`;
    }
  }
}

let aiQty = 1;
function aiChangeQty(delta){
  aiQty = Math.max(0.5, +(aiQty+delta).toFixed(1));
  const el = document.getElementById("aiQty");
  if(el) el.textContent = aiQty+"×";
}

function addAIFood(){
  const r = state.aiResult;
  if(!r) return;
  addFood({
    id: "ai_"+Date.now(),
    name: r.name,
    qty: r.serving,
    weight: r.weight_g,
    unit: "g",
    kcal: Math.round(r.calories * aiQty),
    protein: +(r.protein_g * aiQty).toFixed(1),
    carbs: +(r.carbs_g * aiQty).toFixed(1),
    fat: +(r.fat_g * aiQty).toFixed(1),
  }, state.selectedSlot, aiQty);
  aiQty = 1;
}

// ── RENDER ────────────────────────────────────────────────────────

        <div class="stat-lbl">Water</div>

    <div class="card">

      <div style="font-size:11px;color:#78a8b8;margin-top:5px;text-align:center">

      ${MEAL_SLOTS.map(slot=>{
        const foods=(today.mealFoods||{})[slot.key]||[];

        const pct=Math.min(100,kcal/slot.defaultKcal*100);

            <div><span style="font-size:13px;margin-right:5px">${slot.emoji}</span><span style="font-size:12px;font-weight:600">${slot.label}</span><span style="font-size:10px;color:#446070;margin-left:5px">${slot.time}</span></div>
            <div style="font-size:12px"><span style="font-weight:800;color:${over?"#ef4444":kcal>0?"#00bfa5":"#446070"}">${kcal}</span><span style="color:#446070"> / ${slot.minKcal}–${slot.maxKcal} kcal</span></div>
          </div>
          <div class="pbar" style="height:4px"><div class="pfill" style="width:${pct}%;background:${barColor}"></div></div>
          ${kcal===0?`<div style="font-size:10px;color:#a0c4d0;margin-top:2px;font-style:italic">💡 ${slot.tip}</div>`:""}
          <div style="font-size:10px;margin-top:3px;display:flex;gap:6px">
            <span style="color:#34d399">P:${slot.protein}</span>

      <div style="display:flex;gap:8px;margin-top:10px">

      </div>

    <div class="card">

      </div>
    </div>`;
  }

  else if(state.activeTab==="meals"){
    html+=`<div style="font-size:12px;color:#78a8b8;margin-bottom:10px">Total: <strong style="color:#00bfa5">${totalKcal} kcal</strong> · ${totalFoods} items today</div>`;
    html+=MEAL_SLOTS.map(slot=>{
      const foods=(today.mealFoods||{})[slot.key]||[];
      const kcal=foods.reduce((s,f)=>s+(f.kcal||0),0);
      const pct=Math.min(100,kcal/slot.defaultKcal*100);
      const over=kcal>slot.maxKcal;
      const under=kcal>0&&kcal<slot.minKcal;
      const barColor=over?"#ef4444":kcal>=slot.minKcal&&kcal>0?"#00bfa5":slot.color;
      return `
      <div class="slot-card" style="border-left:3px solid ${slot.color}77">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div><span style="font-size:15px;margin-right:6px">${slot.emoji}</span><span style="font-size:13px;font-weight:700">${slot.label}</span><span style="font-size:11px;color:#446070;margin-left:7px">${slot.time}</span></div>
          <div style="text-align:right"><span style="font-size:13px;font-weight:800;color:${over?"#ef4444":kcal>0?"#00bfa5":"#446070"}">${kcal}</span><span style="font-size:11px;color:#446070"> / ${slot.defaultKcal}</span></div>
        </div>
        <div class="pbar" style="height:5px;margin-bottom:4px"><div class="pfill" style="width:${pct}%;background:${barColor}"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px">
          <span style="color:#8ab4c4">Min:${slot.minKcal}</span>
          <span style="color:${over?"#ef4444":under?"#f59e0b":"#8ab4c4"};font-weight:600">${over?`⚠ ${kcal-slot.maxKcal} over`:under?`↑ eat ${slot.minKcal-kcal} more`:kcal>0?"✓ On target":""}</span>
          <span style="color:#8ab4c4">Max:${slot.maxKcal}</span>
        </div>
        <div style="font-size:11px;color:#a0c4d0;margin-bottom:5px;font-style:italic">💡 ${slot.tip}</div>

          <span>🥩 P: <strong style="color:#34d399">${slot.protein}</strong></span>
          <span>🌾 C: <strong style="color:#fbbf24">${slot.carbs}</strong></span>
          <span>🫒 F: <strong style="color:#a78bfa">${slot.fat}</strong></span>
        </div>
        ${foods.map(f=>`
          <div class="food-item">
            <div style="flex:1">
              <div class="fname">${f.name}</div>
              <div class="fmeta">${f.qty} · <span style="color:#f59e0b">${f.weight}${f.unit}</span></div>
              ${f.protein||f.carbs||f.fat?`<div class="fmacro">P:${f.protein||0}g · C:${f.carbs||0}g · F:${f.fat||0}g</div>`:""}
            </div>
            <span class="fkcal">${f.kcal} kcal</span>
            <button class="remove-btn" onclick="removeFood('${slot.key}','${f.uid}')">✕</button>
          </div>
        `).join("")}
        ${foods.length===0?`<div style="font-size:11px;color:#8ab4c4;font-style:italic">No food logged yet</div>`:""}
      </div>`;
    }).join("");

    html+=`<button class="btn btn-teal btn-full" onclick="switchTab('search')" style="margin-bottom:10px">🔍 Search & Add Food →</button>`;

    // Hungry panel
    html+=`
    <div class="card" style="border:1px solid rgba(250,204,21,.2);background:rgba(250,204,21,.04)">
      <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="state.showHungry=!state.showHungry;render()">
        <div><span style="font-size:14px;margin-right:6px">🍎</span><span style="font-size:13px;font-weight:700;color:#fde68a">Hungry Between Meals?</span></div>
        <span style="font-size:18px;color:#446070;transform:${state.showHungry?"rotate(180deg)":"rotate(0deg)"};display:inline-block">▾</span>
      </div>
      ${state.showHungry?`
      <div style="margin-top:12px">
        <div style="font-size:11px;color:#78a8b8;margin-bottom:8px">Best low-calorie options — tap + Add to log:</div>
        <input class="inp" id="hungryInp" placeholder="Search snack…" value="${state.hungryQuery}" oninput="handleHungryInput(this.value)" autocomplete="off" autocorrect="off" spellcheck="false" style="margin-bottom:10px">
        <div id="hungryResults"></div>
      </div>`:""
    }
    </div>`;
    if(state.showHungry) setTimeout(()=>renderHungryResults(),0);
    html+=`
    <div style="padding:11px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:10px">
      <div style="font-size:12px;font-weight:700;color:#fca5a5;margin-bottom:4px">⚠️ Night Shift Reminder</div>
      <div style="font-size:11px;color:#78a8b8">Avoid heavy carbs after 10 PM. Never skip the pre-work snack.</div>
    </div>`;
  }

  else if(state.activeTab==="search"){
    const aiActive = state.searchMode!=="db";
    html+=`
    <div class="card">
      <div class="card-title">🤖 AI Nutrition Search</div>
      <div style="font-size:11px;color:#78a8b8;margin-bottom:10px">Switch between AI search (any food) or browse our food database.</div>

      <div style="display:flex;gap:6px;margin-bottom:12px">
        <button id="btnAI" class="btn btn-full" style="flex:1;padding:9px;font-size:12px;background:${aiActive?'linear-gradient(135deg,#7c3aed,#6d28d9)':'rgba(255,255,255,.08)'};border:1px solid ${aiActive?'#7c3aed':'rgba(255,255,255,.2)'}" onclick="switchSearchMode('ai')">🤖 AI Search</button>
        <button id="btnDB" class="btn btn-full" style="flex:1;padding:9px;font-size:12px;background:${!aiActive?'linear-gradient(135deg,#006d77,#00897b)':'rgba(255,255,255,.08)'};border:1px solid ${!aiActive?'#006d77':'rgba(255,255,255,.2)'}" onclick="switchSearchMode('db')">📋 Database</button>
      </div>

      <div class="search-wrap" style="margin-bottom:10px">
        <span class="search-icon">${aiActive?'🤖':'🔍'}</span>
        <input class="inp search-inp" id="searchInp"
          placeholder="${aiActive?'Type any food… e.g. 2 idli with sambar':'Type food name… e.g. idli, chicken'}"
          value="${state.searchQuery}"
          oninput="handleSearchInput(this.value)"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="clear-btn" id="searchClearBtn" onclick="clearSearch()" style="display:${state.searchQuery?'inline':'none'}">✕</button>
      </div>

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-size:11px;color:#78a8b8;flex-shrink:0">Add to:</span>
        <select class="inp" style="flex:1;font-size:12px;padding:6px 10px" onchange="state.selectedSlot=this.value">
          ${MEAL_SLOTS.map(s=>`<option value="${s.key}"${state.selectedSlot===s.key?" selected":""}>${s.emoji} ${s.label} (${s.time})</option>`).join("")}
        </select>
      </div>

      ${aiActive?`
        <button class="btn btn-purple btn-full" id="aiSearchBtn" onclick="runAISearch()" style="margin-bottom:10px;padding:11px">🤖 Get AI Nutrition Info</button>
      `:`
        <div style="font-size:11px;color:#8ab4c4;margin-bottom:6px">Quick browse by category:</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
          ${["breakfast","lunch","snack","nonveg","drink","fruit","fastfood","sweet"].map(cat=>
            `<button class="chip" onclick="dbBrowse('${cat}')">${cat.charAt(0).toUpperCase()+cat.slice(1)}</button>`
          ).join("")}
        </div>
      `}

      <div id="searchResults"></div>
    </div>`;
    setTimeout(()=>{ if(state.searchMode==="db") renderSearchResults(); }, 0);
  }

  else if(state.activeTab==="exercise"){
    html+=`
    <div class="card">
      <div class="card-title">🏃 Today's Exercise</div>
      <div class="ex-grid">
        ${EXERCISES.map(ex=>{
          const active=!!(today.exercises||{})[ex.id];
          return `
          <button class="ex-btn${active?" active":""}" onclick="toggleExercise('${ex.id}')">
            <div style="font-size:20px">${ex.emoji}</div>
            <div style="font-weight:700;margin-top:3px">${ex.label}</div>

          </button>`;
        }).join("")}
      </div>
      ${exKcal>0?`<div style="margin-top:10px;padding:8px 11px;background:rgba(0,109,119,.15);border-radius:8px;font-size:12px;color:#80cbc4">🎉 Great! You burned ~${exKcal} kcal today.</div>`:""}
    </div>
    <div class="card">
      <div class="card-title">📅 Weekly Plan</div>
      ${[["Mon–Tue","20–30 min Brisk Walk","Best time: 10–11 AM after waking"],["Wed","Rest / Light Yoga","Stretch and recover"],["Thu–Fri","30 min Walk + Strength","10 squats, 10 lunges, 10 push-ups"],["Sat","Cycling or Jog","Push harder on weekends"],["Sun","Active Rest","Walk, yoga, or family activity"]].map(([day,act,note])=>`
        <div class="week-row">
          <div style="font-size:11px;font-weight:700;color:#006d77;width:50px;flex-shrink:0">${day}</div>
          <div>
            <div style="font-size:12px;font-weight:600">${act}</div>
            <div style="font-size:11px;color:#78a8b8">${note}</div>
          </div>
        </div>
      `).join("")}
    </div>`;
  }

  else if(state.activeTab==="progress"){
    const weekDates=getWeekDates();
    const todayKey=getTodayKey();

    // Sub-tab state
    if(!state.progressTab) state.progressTab="weekly";

    const wtVals=weekDates.map(d=>(state.data[d]||{}).weight).filter(Boolean);
    const maxWt=wtVals.length?Math.max(...wtVals)+1:86;
    const minWt=wtVals.length?Math.min(...wtVals)-1:70;
    const range=maxWt-minWt||5;

    // Get all logged dates sorted
    const allDates = Object.keys(state.data).sort();

    // Monthly grouping
    function getMonthDates(year, month){
      return allDates.filter(d=>d.startsWith(`${year}-${String(month).padStart(2,'0')}`));
    }
    function getMonthSummary(dates){
      let totalKcal=0,totalDays=0,totalEx=0,totalWater=0,weights=[];
      dates.forEach(d=>{
        const day=state.data[d]||{};
        const kcal=Object.values(day.mealFoods||{}).flat().reduce((s,f)=>s+(f.kcal||0),0);
        if(kcal>0){ totalKcal+=kcal; totalDays++; }
        totalEx+=Object.values(day.exercises||{}).filter(Boolean).length;
        totalWater+=(day.water||0);
        if(day.weight) weights.push(day.weight);
      });
      return {totalKcal,totalDays,totalEx,totalWater,weights,avgKcal:totalDays?Math.round(totalKcal/totalDays):0};
    }

    // Get unique months from data
    const months = [...new Set(allDates.map(d=>d.slice(0,7)))].sort().reverse().slice(0,6);

    html+=`

    </div>`;

    // ── WEEKLY TAB ──

      html+=`
      <div class="card">
        <div class="card-title">⚖️ Weight This Week</div>
        <div class="bar-chart">
          ${weekDates.map(date=>{
            const w=(state.data[date]||{}).weight;
            const pct=w?((w-minWt)/range)*70+10:0;
            const isToday=date===todayKey;
            return `
            <div class="bar-col">
              ${w?`<div class="bar-val">${w}</div>`:"<div class='bar-val'>-</div>"}
              <div class="bar-track"><div class="bar-fill" style="height:${w?pct:3}%;background:${isToday?"#006d77":"#00bfa566"}"></div></div>
              <div class="bar-day">${new Date(date+"T12:00:00").toLocaleDateString("en",{weekday:"short"})}</div>
            </div>`;
          }).join("")}
        </div>
        ${wtVals.length>=2?`<div style="font-size:11px;color:#78a8b8;text-align:center;margin-top:4px">

        </div>`:""}
      </div>

      <div class="card">
        <div class="card-title">📅 This Week's Log</div>
        ${weekDates.map(date=>{
          const d=state.data[date]||{};
          const foods=Object.values(d.mealFoods||{}).flat().length;
          const kcal=Object.values(d.mealFoods||{}).flat().reduce((s,f)=>s+(f.kcal||0),0);
          const ex=Object.values(d.exercises||{}).filter(Boolean).length;
          const water=(d.water||0)*250;
          const isToday=date===todayKey;
          const onTarget=kcal>=1600&&kcal<=1800;
          return `
          <div style="display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;margin-bottom:4px;background:${isToday?"rgba(0,109,119,.15)":"rgba(255,255,255,.03)"}">
            <div style="width:48px;font-size:11px;font-weight:${isToday?700:400};color:${isToday?"#80cbc4":"#78a8b8"}">
              ${isToday?"Today":new Date(date+"T12:00:00").toLocaleDateString("en",{weekday:"short",day:"numeric"})}
            </div>
            <div style="flex:1">
              <div style="display:flex;gap:7px;font-size:11px;flex-wrap:wrap">
                <span title="Foods logged">🍽️ ${foods}</span>
                ${kcal>0?`<span style="color:${onTarget?'#34d399':'#f59e0b'}" title="Calories">🔥 ${kcal}</span>`:`<span style="color:#446070">🔥 —</span>`}
                <span title="Exercise">🏃 ${ex}</span>
                <span title="Water">💧 ${water}ml</span>
                ${d.weight?`<span title="Weight">⚖️ ${d.weight}kg</span>`:""}
              </div>
            </div>
            <div style="display:flex;gap:3px">
              ${[foods>=3,ex>=1,(d.water||0)>=8,kcal>=1600&&kcal<=1900].map(done=>`<div class="dot" style="background:${done?"#00bfa5":"#1a3545"}"></div>`).join("")}
            </div>
